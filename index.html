<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌿 小幫手</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小幫手">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f4f0">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;小幫手&quot;,&quot;short_name&quot;:&quot;小幫手&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23f2f4f0&quot;,&quot;theme_color&quot;:&quot;%23f2f4f0&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;any&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Nunito:wght@400;600;700;800&display=swap');
:root {
  --bg:#f2f4f0; --surface:#fff; --surface2:#eef0ec; --border:#d8ddd4;
  --green:#7a9e87; --green-d:#5c7f6c; --green-s:#e0ede6;
  --blue:#7b9bba; --blue-s:#e2eaf3;
  --purple:#9e8db5; --purple-s:#eae6f2;
  --orange:#b5936a; --orange-s:#f2e8dc;
  --red:#b5746a; --red-s:#f2e0de;
  --text:#3c403a; --muted:#8e9488;
  --shadow:rgba(122,158,135,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}

/* ── STATUS + HEADER ── */
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0;font-size:12px;color:var(--muted);font-weight:700;}
.header{padding:12px 20px 10px;display:flex;justify-content:space-between;align-items:center;}
.header-title{font-size:24px;font-weight:800;color:var(--green-d);}
.header-date{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
.add-btn{width:42px;height:42px;border-radius:50%;background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 4px 14px var(--shadow);flex-shrink:0;}
.add-btn:active{transform:scale(.9);}

/* ── AI BAR ── */
.ai-bar{margin:0 16px 12px;background:var(--surface);border:2px solid var(--blue);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(123,155,186,.12);}
.ai-bar-label{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.ai-row{display:flex;gap:8px;align-items:flex-end;}
.ai-textarea{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:13px;font-weight:600;outline:none;resize:none;line-height:1.5;min-height:44px;max-height:100px;}
.ai-textarea:focus{border-color:var(--blue);}
.ai-textarea::placeholder{color:var(--muted);}
.ai-voice-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-voice-btn.recording{background:var(--red-s);border-color:var(--red);animation:pulse 1s ease-in-out infinite;}
.ai-send-btn{padding:10px 14px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:12px;font-weight:800;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;flex-shrink:0;}
.ai-send-btn:disabled{opacity:.5;}
.ai-result{margin:0 16px 12px;background:var(--surface);border:2px solid var(--blue-s);border-radius:16px;padding:14px;display:none;box-shadow:0 2px 10px rgba(123,155,186,.1);}
.ai-result.visible{display:block;}
.ai-result-title{font-size:11px;font-weight:800;color:var(--blue);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
.ai-result-card{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px;border:1.5px solid var(--border);}
.ai-result-type{font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;text-transform:uppercase;}
.ai-result-text{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.4;}
.ai-result-tags{display:flex;gap:5px;flex-wrap:wrap;}
.ai-rtag{padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;}
.ai-rtag.schedule{background:var(--green-s);color:var(--green-d);}
.ai-rtag.task-soon{background:var(--blue-s);color:var(--blue);}
.ai-rtag.task-year{background:var(--purple-s);color:var(--purple);}
.ai-rtag.note{background:#e8f0e4;color:#5a7a52;}
.ai-reasoning{font-size:11px;color:var(--muted);margin-top:6px;font-weight:600;}
.ai-actions{display:flex;gap:8px;margin-top:10px;}
.ai-accept{flex:2;padding:10px;border-radius:10px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:800;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;}
.ai-reject{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;}
.ai-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);margin:0 2px;animation:dotBounce 1.2s ease-in-out infinite;}
.ai-dots span:nth-child(2){animation-delay:.2s;}
.ai-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ── NAV TABS ── */
.nav-tabs{display:flex;padding:0 12px;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex:none;padding:8px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;text-align:center;font-weight:700;white-space:nowrap;position:relative;}
.nav-tab.active-cal    {background:var(--green-s);border-color:var(--green);color:var(--green-d);}
.nav-tab.active-today  {background:var(--green-s);border-color:var(--green);color:var(--green-d);}
.nav-tab.active-tasks  {background:var(--blue-s);border-color:var(--blue);color:var(--blue);}
.nav-tab.active-weight {background:var(--orange-s);border-color:var(--orange);color:var(--orange);}
.nav-tab.active-kb     {background:#e8f0e4;border-color:#5a7a52;color:#5a7a52;}
.tab-badge{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--red);font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}

/* ── SECTIONS ── */
.section{padding:0 16px 90px;display:none;}
.section.visible{display:block;}
.sec-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:5px;}
.sec-label::before{content:'';width:3px;height:12px;border-radius:2px;background:currentColor;flex-shrink:0;}

/* ── CALENDAR ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-size:18px;font-weight:800;color:var(--text);}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.cal-nav-btn:active{background:var(--green-s);}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-dow{text-align:center;font-size:10px;font-weight:800;color:var(--muted);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;position:relative;padding:2px;}
.cal-cell:active{background:var(--green-s);}
.cal-cell.other-month .cal-num{color:var(--border);}
.cal-cell.is-today{background:var(--green);border-radius:10px;}
.cal-cell.is-today .cal-num{color:#fff;font-weight:800;}
.cal-cell.selected{background:var(--green-s);border:2px solid var(--green);}
.cal-num{font-size:13px;font-weight:700;color:var(--text);line-height:1;}
.cal-dots{display:flex;gap:2px;margin-top:2px;justify-content:center;}
.cal-dot{width:4px;height:4px;border-radius:50%;}
.cal-dot.schedule{background:var(--green);}
.cal-dot.task{background:var(--blue);}

.cal-day-panel{background:var(--surface);border-radius:16px;padding:14px;margin-top:14px;border:1.5px solid var(--border);box-shadow:0 2px 8px var(--shadow);}
.cal-day-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:12px;}
.cal-day-empty{text-align:center;padding:20px;color:var(--muted);font-size:12px;font-weight:600;}

/* ── EVENT / TASK CARDS ── */
.event-card{background:var(--bg);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px;border:1.5px solid var(--border);display:flex;align-items:flex-start;gap:10px;position:relative;overflow:hidden;}
.event-card.type-schedule::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);}
.event-card.type-task-soon::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);}
.event-card.type-task-year::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--purple);}
.event-card.type-trip::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);}
.event-card.is-done{opacity:.55;}
.event-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--surface);}
.event-check.checked-schedule{background:var(--green);border-color:var(--green);}
.event-check.checked-task{background:var(--blue);border-color:var(--blue);}
.event-check.checked-year{background:var(--purple);border-color:var(--purple);}
.event-check.checked-trip{background:var(--orange);border-color:var(--orange);}
.event-check.checked-schedule::after,.event-check.checked-task::after,.event-check.checked-year::after,.event-check.checked-trip::after{content:'✓';font-size:12px;color:#fff;font-weight:800;}
.event-body{flex:1;min-width:0;padding-right:20px;}
.event-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:4px;}
.event-name.done{text-decoration:line-through;color:var(--muted);}
.event-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.etag{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;}
.etag-schedule{background:var(--green-s);color:var(--green-d);}
.etag-task{background:var(--blue-s);color:var(--blue);}
.etag-year{background:var(--purple-s);color:var(--purple);}
.etag-trip{background:var(--orange-s);color:var(--orange);}
.etag-time{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.etag-warn{background:var(--red-s);color:var(--red);}
.etag-carried{background:var(--red-s);color:var(--red);}
.event-del{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;}
.event-del:active{background:var(--red-s);color:var(--red);border-color:var(--red);}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;font-weight:600;line-height:2;}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.5;}

/* ── ADD MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(40,44,38,.4);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.overlay.visible{display:flex;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:18px 20px 44px;width:100%;max-width:480px;border-top:2px solid var(--border);animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:16px;}

/* type toggle */
.type-toggle{display:flex;gap:6px;margin-bottom:16px;}
.type-btn{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;font-weight:700;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;text-align:center;line-height:1.4;}
.type-btn.sel-schedule{border-color:var(--green);background:var(--green-s);color:var(--green-d);}
.type-btn.sel-task-soon{border-color:var(--blue);background:var(--blue-s);color:var(--blue);}
.type-btn.sel-task-year{border-color:var(--purple);background:var(--purple-s);color:var(--purple);}

.field-label{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px;letter-spacing:.03em;}
.field-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:14px;font-weight:600;outline:none;margin-bottom:12px;color-scheme:light;-webkit-appearance:none;}
.field-input:focus{border-color:var(--green);}
.field-input::placeholder{color:var(--muted);}
textarea.field-input{resize:none;line-height:1.5;}

.field-row{display:flex;gap:8px;margin-bottom:12px;}
.field-row .field-input{margin-bottom:0;}

/* trip toggle */
.trip-toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:var(--orange-s);border-radius:12px;padding:10px 14px;border:1.5px solid #d4a87c;}
.trip-toggle-label{flex:1;font-size:13px;font-weight:700;color:#8a5c30;}
.toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:.2s;}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked+.toggle-slider{background:var(--orange);}
input:checked+.toggle-slider::before{transform:translateX(18px);}

.modal-actions{display:flex;gap:10px;margin-top:4px;}
.btn-cancel{flex:1;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:14px;cursor:pointer;font-weight:700;}
.btn-save{flex:2;padding:14px;border-radius:12px;border:none;background:var(--green);color:#fff;font-family:'Nunito','Noto Sans TC',sans-serif;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px var(--shadow);}
.btn-save:active{opacity:.85;}

/* voice modal */
.voice-area{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;cursor:pointer;min-height:60px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:13px;font-weight:600;background:var(--bg);}
.voice-area.active{border-color:var(--green);color:var(--green-d);background:var(--green-s);}

/* ── WEIGHT ── */
.wt-reminder{background:linear-gradient(135deg,var(--orange-s),#ede5d8);border:1.5px solid #d4a87c;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
.wt-icon{font-size:30px;flex-shrink:0;}
.wt-reminder-body{flex:1;}
.wt-reminder-title{font-size:14px;font-weight:800;color:#8a5c30;margin-bottom:2px;}
.wt-reminder-sub{font-size:11px;color:#a07040;font-weight:600;}
.wt-log-btn{padding:9px 14px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:800;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;white-space:nowrap;}
.wt-goal-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.wt-goal-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.wt-goal-label{font-size:12px;font-weight:800;color:var(--muted);flex:1;}
.wt-goal-val{font-size:14px;font-weight:800;color:var(--orange);}
.wt-goal-inp-row{display:flex;gap:8px;align-items:center;}
.wt-goal-input{flex:1;background:var(--orange-s);border:1.5px solid #d4a87c;border-radius:10px;padding:9px 12px;color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:15px;font-weight:800;outline:none;text-align:center;}
.wt-goal-input:focus{border-color:var(--orange);}
.wt-goal-set-btn{padding:9px 14px;border-radius:10px;border:none;background:var(--orange);color:#fff;font-size:12px;font-weight:800;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;}
.wt-goal-progress{margin-top:10px;}
.wt-goal-track{width:100%;height:7px;background:var(--bg);border-radius:5px;overflow:hidden;margin-bottom:4px;}
.wt-goal-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--orange),#c8aa80);transition:width .6s ease;}
.wt-goal-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;}
.wt-period-row{display:flex;gap:6px;margin-bottom:12px;}
.wt-period-btn{flex:1;padding:7px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:800;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;text-align:center;}
.wt-period-btn.active{background:var(--orange-s);border-color:var(--orange);color:var(--orange);}
.wt-chart{margin-bottom:12px;background:var(--surface);border-radius:14px;padding:14px 12px 10px;border:1.5px solid var(--border);}
.wt-chart-title{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
.wt-chart-title span{color:var(--orange);}
.chart-svg{width:100%;overflow:visible;display:block;}
.wt-hist-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 8px;display:flex;align-items:center;gap:5px;}
.wt-hist-label::before{content:'';width:3px;height:12px;border-radius:2px;background:var(--orange);flex-shrink:0;}
.wt-entry{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:7px;}
.wt-entry-date{font-size:11px;color:var(--muted);font-weight:700;flex:1;}
.wt-entry-val{font-size:17px;font-weight:800;color:var(--orange);}
.wt-entry-diff{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;}
.wt-entry-diff.up{background:var(--red-s);color:var(--red);}
.wt-entry-diff.down{background:#e6f0e8;color:#5a8f66;}
.wt-entry-diff.same{background:var(--bg);color:var(--muted);}
.wt-del{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.wt-del:active{background:var(--red-s);color:var(--red);border-color:var(--red);}
.wt-empty{text-align:center;padding:28px 20px;color:var(--muted);font-size:12px;font-weight:600;}

/* ── KB ── */
.kb-search{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:14px;font-weight:600;outline:none;margin-bottom:10px;}
.kb-search:focus{border-color:#5a7a52;}
.kb-filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.kb-filter-btn{padding:5px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;font-family:'Nunito','Noto Sans TC',sans-serif;cursor:pointer;}
.kb-filter-btn.act-all{background:var(--bg);border-color:var(--text);color:var(--text);}
.kb-filter-btn.act-annual{background:var(--purple-s);border-color:var(--purple);color:var(--purple);}

.kb-card-title{font-size:14px;font-weight:800;color:var(--text);flex:1;line-height:1.3;}

.kb-card-del:active{background:var(--red-s);color:var(--red);border-color:var(--red);}
.kb-card-body{font-size:12px;color:#5c6058;line-height:1.6;margin-bottom:8px;font-weight:500;}
.kb-card-footer{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.kb-tag{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;}
.kb-tag-annual{background:var(--purple-s);color:var(--purple);}
.kb-tag-study{background:var(--blue-s);color:var(--blue);}
.kb-tag-other{background:var(--green-s);color:var(--green-d);}
.kb-date{font-size:10px;color:var(--muted);font-weight:600;margin-left:auto;}
.kb-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:12px;font-weight:600;line-height:2;}

/* ── WEIGHT MODAL ── */
.wt-overlay{position:fixed;inset:0;background:rgba(40,44,38,.4);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:110;}
.wt-overlay.visible{display:flex;}
.wt-modal{background:var(--surface);border-radius:24px 24px 0 0;padding:18px 20px 44px;width:100%;max-width:480px;border-top:2px solid #d4a87c;animation:slideUp .25s ease;}
.wt-modal-title{font-size:20px;font-weight:800;color:var(--orange);margin-bottom:16px;}
.wt-inp-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;}
.wt-number{flex:1;background:var(--orange-s);border:1.5px solid #d4a87c;border-radius:12px;padding:12px;color:var(--text);font-family:'Nunito','Noto Sans TC',sans-serif;font-size:22px;font-weight:800;outline:none;text-align:center;}
.wt-number:focus{border-color:var(--orange);}

/* ── FAB ── */

@media(max-width:480px){.voice-fab{right:16px;}}
.voice-fab:active{transform:scale(.91);}
.voice-fab.recording{background:var(--red);animation:pulse 1s ease-in-out infinite;}

/* ── TOAST ── */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);border-radius:20px;padding:9px 20px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;z-index:200;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

/* today section summary */
.today-summary{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:12px;border:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.today-summary-label{font-size:12px;font-weight:700;color:var(--muted);}
.today-summary-count{font-size:13px;font-weight:800;color:var(--green-d);}
</style>
</head>

<script>
// ═══════════ STORAGE KEYS ═══════════
const EVENTS_KEY='events_v1', WT_KEY='wt_v1', WT_GOAL_KEY='wt_goal_v1', KB_KEY='kb_v1', DATE_KEY='last_date_v1';

// ═══════════ STATE ═══════════
let events = JSON.parse(localStorage.getItem(EVENTS_KEY)||'[]');
// Seed sample data if empty
if(!events.length){
  const t=todayStr();
  events=[
    {id:'e1',type:'schedule',name:'跑步 45 分鐘',date:t,time:'07:00',trip:false,done:false},
    {id:'e2',type:'task-soon',name:'完成學術論文初稿',date:'',deadline:offsetDate(7),done:false,carried:false},
    {id:'e3',type:'task-year',name:'半馬完賽 sub 2:00',date:'',deadline:'',done:false,carried:false},
    {id:'e4',type:'task-year',name:'籌辦年會',date:'',deadline:'2026-12-31',done:false,carried:false},
    {id:'e5',type:'task-year',name:'完成 Study',date:'',deadline:'2026-12-31',done:false,carried:false},
  ];
  saveEvents();
}

let weightLog=JSON.parse(localStorage.getItem(WT_KEY)||'[]');
let weightGoal=parseFloat(localStorage.getItem(WT_GOAL_KEY)||'0')||0;
let kbNotes=JSON.parse(localStorage.getItem(KB_KEY)||'[]');
let chartMonths=1;
let kbFilter='all';

let currentTab='today';
let selectedType='schedule';
let calYear=new Date().getFullYear();
let calMonth=new Date().getMonth();
let selectedDate=todayStr();

let modalVoiceRecording=false, modalVoiceRec=null;
let aiVoiceRecording=false, aiVoiceRec=null;
let nextId=100;

// ═══════════ HELPERS ═══════════
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function offsetDate(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveEvents(){ localStorage.setItem(EVENTS_KEY,JSON.stringify(events)); }
function saveWt(){ localStorage.setItem(WT_KEY,JSON.stringify(weightLog)); }
function saveGoal(){ localStorage.setItem(WT_GOAL_KEY,String(weightGoal)); }
function saveKB(){ localStorage.setItem(KB_KEY,JSON.stringify(kbNotes)); }
function uid(){ return 'id'+(Date.now())+(Math.random()*1000|0); }

function fmtDate(d){
  if(!d)return '';
  const[y,m,day]=d.split('-');
  const days=['日','一','二','三','四','五','六'];
  return `${parseInt(m)}/${parseInt(day)}（週${days[new Date(d).getDay()]}）`;
}

function getWeekKey(dateStr){
  const d=new Date(dateStr||todayStr());
  const jan1=new Date(d.getFullYear(),0,1);
  const wk=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function hasWeightThisWeek(){ return weightLog.some(w=>getWeekKey(w.date)===getWeekKey(todayStr())); }

// ═══════════ DAY CHANGE (carry-over) ═══════════
function runDayChange(){
  const last=localStorage.getItem(DATE_KEY)||'';
  const today=todayStr();
  if(last===today)return;
  localStorage.setItem(DATE_KEY,today);
  // carry over unfinished schedule events from past days
  const toCarry=events.filter(e=>e.type==='schedule'&&!e.done&&e.date&&e.date<today&&!e.carried);
  toCarry.forEach(e=>{
    const copy={...e,id:uid(),date:today,carried:true,done:false};
    events.push(copy);
    e.carried=true;
  });
  saveEvents();
}

// ═══════════ CALENDAR ═══════════
function renderCalendar(){
  const label=document.getElementById('cal-month-label');
  label.textContent=`${calYear} 年 ${calMonth+1} 月`;
  const grid=document.getElementById('cal-grid');
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const daysInPrev=new Date(calYear,calMonth,0).getDate();
  const today=todayStr();
  let cells='';
  let total=firstDay+daysInMonth;
  if(total%7!==0)total+=7-total%7;

  for(let i=0;i<total;i++){
    let day,month,year,isOther=false;
    if(i<firstDay){ day=daysInPrev-firstDay+i+1; month=calMonth-1; year=calYear; isOther=true; }
    else if(i>=firstDay+daysInMonth){ day=i-firstDay-daysInMonth+1; month=calMonth+1; year=calYear; isOther=true; }
    else{ day=i-firstDay+1; month=calMonth; year=calYear; }
    if(month<0){month=11;year--;}
    if(month>11){month=0;year++;}
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday=dateStr===today;
    const isSel=dateStr===selectedDate;
    const dayEvents=events.filter(e=>e.date===dateStr);
    const hasSched=dayEvents.some(e=>e.type==='schedule'||e.type==='task-soon');
    const hasTask=dayEvents.some(e=>e.type==='task-year');
    const dots=(hasSched?`<div class="cal-dot schedule"></div>`:'')+
               (hasTask?`<div class="cal-dot task"></div>`:'');
    cells+=`<div class="cal-cell ${isOther?'other-month':''} ${isToday?'is-today':''} ${isSel&&!isToday?'selected':''}" onclick="selectDate('${dateStr}')">
      <div class="cal-num">${day}</div>
      ${dots?`<div class="cal-dots">${dots}</div>`:''}
    </div>`;
  }
  grid.innerHTML=cells;
  renderDayPanel();
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

function selectDate(dateStr){
  selectedDate=dateStr;
  renderCalendar();
}

function renderDayPanel(){
  const panel=document.getElementById('cal-day-panel');
  const title=document.getElementById('cal-day-title');
  const list=document.getElementById('cal-day-list');
  const dayEvts=events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  title.textContent=fmtDate(selectedDate)+(selectedDate===todayStr()?' 今天':'');
  panel.style.display='block';
  if(!dayEvts.length){
    list.innerHTML=`<div class="cal-day-empty">這天沒有行程或任務<br><small>點右上角 + 新增</small></div>`;
    return;
  }
  list.innerHTML=dayEvts.map(e=>eventCardHTML(e)).join('');
}

// ═══════════ EVENT CARD ═══════════
function eventCardHTML(e){
  const typeClass=e.trip?'type-trip':`type-${e.type}`;
  const checkClass=e.done?(e.trip?'checked-trip':e.type==='task-year'?'checked-year':e.type==='task-soon'?'checked-task':'checked-schedule'):'';
  let tags='';
  if(e.trip) tags+=`<span class="etag etag-trip">📍 出差行程</span>`;
  if(e.time) tags+=`<span class="etag etag-time">🕐 ${e.time}</span>`;
  if(e.carried) tags+=`<span class="etag etag-carried">🔁 順延</span>`;
  if(e.type==='task-soon'&&e.deadline) tags+=`<span class="etag etag-task">截止 ${fmtDate(e.deadline)}</span>`;
  if(e.type==='task-year') tags+=`<span class="etag etag-year">年度目標</span>`;
  if(!tags&&e.type==='schedule') tags=`<span class="etag etag-schedule">行程</span>`;
  const today=todayStr();
  if(e.type==='schedule'&&e.date<today&&!e.done) tags+=`<span class="etag etag-warn">⚠ 未完成</span>`;
  return `<div class="event-card ${typeClass} ${e.done?'is-done':''}">
    <div class="event-check ${checkClass}" onclick="toggleEvent('${e.id}')"></div>
    <div class="event-body">
      <div class="event-name ${e.done?'done':''}">${escHtml(e.name)}</div>
      <div class="event-meta">${tags}</div>
    </div>
    <button class="event-del" onclick="deleteEvent('${e.id}')">✕</button>
  </div>`;
}

function toggleEvent(id){
  const e=events.find(x=>x.id===id);
  if(e) e.done=!e.done;
  saveEvents(); renderAll();
}

function deleteEvent(id){
  events=events.filter(e=>e.id!==id);
  saveEvents(); renderAll();
}

// ═══════════ TODAY ═══════════
function renderToday(){
  const today=todayStr();

  // Today's schedule events sorted by time
  const todaySchedule=events.filter(e=>e.type==='schedule'&&e.date===today)
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));

  // Overdue schedule (past days not done, carried)
  const overdueSchedule=events.filter(e=>e.type==='schedule'&&e.date<today&&!e.done&&e.carried);

  const allToday=[...overdueSchedule,...todaySchedule];

  // Progress
  const total=allToday.length;
  const done=allToday.filter(e=>e.done).length;
  document.getElementById('today-progress').textContent=total?`${done} / ${total} 完成`:'今天沒有行程';

  // Trip reminders (within 60 days, not today)
  const trips=events.filter(e=>e.type==='schedule'&&e.trip&&!e.done&&e.date>today).filter(e=>{
    const diff=Math.round((new Date(e.date)-new Date(today))/86400000);
    return diff<=60;
  });

  const el=document.getElementById('list-today');
  let html='';

  if(trips.length){
    html+=`<div class="sec-label" style="color:var(--orange);margin-bottom:8px;margin-top:0">📍 出差行程提醒</div>`;
    html+=trips.map(e=>{
      const diff=Math.round((new Date(e.date)-new Date(today))/86400000);
      const warn=diff<=7;
      return `<div class="event-card type-trip" style="margin-bottom:8px">
        <div class="event-body" style="padding-right:0">
          <div class="event-name">${escHtml(e.name)}</div>
          <div class="event-meta">
            <span class="etag ${warn?'etag-warn':'etag-trip'}">${warn?`⚠ ${diff} 天後`:`${diff} 天後`} · ${fmtDate(e.date)}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

只回覆JSON`;

  }

function setGoal(){
  const v=parseFloat(document.getElementById('wt-goal-input').value);
  if(!v||v<20||v>300){showToast('請輸入正確體重');return;}
  weightGoal=v; document.getElementById('wt-goal-input').value='';
  saveGoal(); renderWeight(); showToast(`目標設定：${v} kg ✓`);
}

function renderGoalBar(){
  const disp=document.getElementById('wt-goal-display');
  const prog=document.getElementById('wt-goal-progress');
  if(!weightGoal){disp.textContent='未設定';prog.style.display='none';return;}
  disp.textContent=weightGoal+' kg';
  if(!weightLog.length){prog.style.display='none';return;}
  const sorted=[...weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=sorted[sorted.length-1].value;
  const first=sorted[0].value;
  const totalNeeded=Math.abs(first-weightGoal)||1;
  const moved=first-latest;
  const goalDir=first>weightGoal?1:-1;
  const pct=Math.max(0,Math.min(100,((moved*goalDir)/totalNeeded)*100));
  const diff=(latest-weightGoal).toFixed(1);
  document.getElementById('wt-goal-fill').style.width=pct+'%';
  document.getElementById('wt-goal-meta-l').textContent=`目前 ${latest} kg`;
  document.getElementById('wt-goal-meta-r').textContent=diff==0?'已達標！':diff>0?`還差 ${diff} kg`:`超標 ${Math.abs(diff)} kg`;
  prog.style.display='block';
}

function setPeriod(btn){ chartMonths=parseInt(btn.dataset.months); document.querySelectorAll('.wt-period-btn').forEach(b=>b.classList.toggle('active',b===btn)); renderWeightList(); }

function filterByPeriod(log){ if(!chartMonths)return[...log]; const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-chartMonths); const cutStr=cutoff.toISOString().split('T')[0]; return log.filter(w=>w.date>=cutStr); }

function renderWeightList(){
  const listEl=document.getElementById('wt-list'); const chartEl=document.getElementById('wt-chart-area');
  if(!weightLog.length){listEl.innerHTML=`<div class="wt-empty">🌱 還沒有記錄，開始量體重吧！</div>`;chartEl.innerHTML='';return;}
  const allSorted=[...weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const filtered=filterByPeriod(allSorted);
  if(filtered.length<2){chartEl.innerHTML=`<div class="wt-chart"><div style="text-align:center;padding:20px;color:var(--muted);font-size:12px;font-weight:700;">記錄更多才能顯示趨勢圖</div></div>`;}
  else{
    const vals=filtered.map(w=>w.value);
    const allVals=weightGoal>0?[...vals,weightGoal]:vals;
    const raw_mn=Math.min(...allVals),raw_mx=Math.max(...allVals);
    const pv=(raw_mx-raw_mn)||2;
    const mn=raw_mn-pv*.25,mx=raw_mx+pv*.25;
    const W=320,H=110,padL=36,padR=10,padT=12,padB=24,cW=W-padL-padR,cH=H-padT-padB;
    const toX=i=>padL+(i/(filtered.length-1))*cW;
    const toY=v=>padT+cH-((v-mn)/(mx-mn))*cH;
    const pts=filtered.map((w,i)=>({x:toX(i),y:toY(w.value),v:w.value,date:w.date}));
    const path=pts.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');
    const area=`${path} L${pts[pts.length-1].x},${padT+cH} L${pts[0].x},${padT+cH} Z`;
    const ySteps=[mn,(mn+mx)/2,mx];
    const yLabels=ySteps.map(v=>`<text x="${padL-4}" y="${toY(v)+3}" text-anchor="end" font-size="9" fill="#8e9488" font-weight="700" font-family="Nunito,sans-serif">${v.toFixed(1)}</text>`).join('');
    const idxs=[0,Math.floor((filtered.length-1)/2),filtered.length-1].filter((v,i,a)=>a.indexOf(v)===i&&filtered.length>1);
    const xLabels=idxs.map(i=>{const[,m,d]=filtered[i].date.split('-');return `<text x="${toX(i)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#8e9488" font-weight="700" font-family="Nunito,sans-serif">${parseInt(m)}/${parseInt(d)}</text>`;}).join('');
    let goalLine='';
    if(weightGoal>0&&weightGoal>=mn&&weightGoal<=mx){const gy=toY(weightGoal);goalLine=`<line x1="${padL}" y1="${gy}" x2="${padL+cW}" y2="${gy}" stroke="#7b9bba" stroke-width="1.5" stroke-dasharray="5,4" opacity=".7"/><text x="${padL+cW-2}" y="${gy-4}" text-anchor="end" font-size="9" fill="#7b9bba" font-weight="800" font-family="Nunito,sans-serif">目標 ${weightGoal}</text>`;}
    const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#b5936a" stroke="#fff" stroke-width="1.5"><title>${p.date} · ${p.v}kg</title></circle>`).join('');
    const periodLabel=chartMonths===1?'近 1 個月':chartMonths===3?'近 3 個月':'全部記錄';
    const minV=Math.min(...vals).toFixed(1),maxV=Math.max(...vals).toFixed(1);
    chartEl.innerHTML=`<div class="wt-chart"><div class="wt-chart-title"><span>${periodLabel}</span><span>最低 ${minV} · 最高 ${maxV} kg</span></div><svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}"><defs><linearGradient id="wg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b5936a" stop-opacity=".22"/><stop offset="100%" stop-color="#b5936a" stop-opacity="0"/></linearGradient></defs>${ySteps.map(v=>`<line x1="${padL}" y1="${toY(v)}" x2="${padL+cW}" y2="${toY(v)}" stroke="#d8ddd4" stroke-width="1"/>`).join('')}${goalLine}<path d="${area}" fill="url(#wg3)"/><path d="${path}" fill="none" stroke="#b5936a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${yLabels}${xLabels}</svg></div>`;
  }
  const rev=[...filtered].reverse();
  listEl.innerHTML=rev.map((w,i)=>{
    const prev=rev[i+1];
    let diff='';
    if(prev){const dv=(w.value-prev.value).toFixed(1);const cls=dv>0?'up':dv<0?'down':'same';const sym=dv>0?'▲':dv<0?'▼':'→';diff=`<span class="wt-entry-diff ${cls}">${sym} ${Math.abs(dv)}</span>`;}
    const[,m,day]=w.date.split('-');
    const dayName=['日','一','二','三','四','五','六'][new Date(w.date).getDay()];
    return `<div class="wt-entry"><div class="wt-entry-date">${parseInt(m)}/${parseInt(day)}（週${dayName}）</div><div class="wt-entry-val">${w.value} kg</div>${diff}<button class="wt-del" onclick="delWeight('${w.id}')">✕</button></div>`;
  }).join('')||`<div class="wt-empty">此時段沒有記錄</div>`;
}
